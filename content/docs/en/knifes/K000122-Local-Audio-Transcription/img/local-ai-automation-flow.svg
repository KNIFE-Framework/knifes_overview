<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 575" width="1000" height="575" role="img" aria-label="Full context: VS Code runs the Claude Code extension, which sends prompts to the cloud Claude model and receives scripts and commands. A script in the terminal starts the local chain on the Mac: an inbox folder, local Whisper, a local AI through Ollama, output, human review and a KNIFE item. Recordings and texts do not leave the computer unless Claude reads them.">
<style>
text{font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif;font-size:13px;fill:#1c2624}
.tb{font-weight:600}.ts{font-size:12px;fill:#5d6b67}
.tm{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:11.5px}
.tc{font-size:11px;fill:#0b6e63;letter-spacing:.06em;text-transform:uppercase}
.stage{fill:#d9ede9;stroke:#0b6e63;stroke-width:1.5}
.draft{fill:#f2f7f6;stroke:#0b6e63;stroke-width:1.5;stroke-dasharray:6 4}
.box{fill:#fff;stroke:#8a9893;stroke-width:1.3}
.win{fill:#eef1f0;stroke:#8a9893;stroke-width:1.3}
.fence{fill:none;stroke:#0b6e63;stroke-width:1.4;stroke-dasharray:7 5}
.gray{fill:#fff;stroke:#8a9893;stroke-width:1.2;stroke-dasharray:3 3}
.cloud{fill:#fff;stroke:#1c2624;stroke-width:1.4}
.lna{fill:none;stroke:#0b6e63;stroke-width:1.8}
.lnd{fill:none;stroke:#0b6e63;stroke-width:1.5;stroke-dasharray:5 4}
.lng{fill:none;stroke:#5d6b67;stroke-width:1.3}
.acc{fill:#0b6e63}
</style>
<defs><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="acc"/></marker></defs>
<rect width="1000" height="575" fill="#f8faf9"/>
<rect class="cloud" x="40" y="12" width="380" height="64" rx="8"/><text class="tb" x="56" y="38">Cloud: Claude model (Anthropic)</text><text class="ts" x="56" y="58">sees only prompts and what Claude reads</text>
<rect class="gray" x="640" y="12" width="340" height="52" rx="26"/><text class="ts" x="662" y="34">Cloud AI, online transcription</text><text class="ts" x="662" y="52" style="font-size:11px">over the recording: not used</text><path class="lng" d="M944 22 L968 54 M968 22 L944 54"/>
<rect class="fence" x="20" y="126" width="960" height="394" rx="8"/><text class="tc" x="340" y="146">Your computer: recordings and texts stay here</text>
<rect class="win" x="40" y="156" width="260" height="274" rx="6"/><text class="tb" x="130" y="178">VS Code</text>
<rect class="stage" x="56" y="192" width="228" height="68" rx="4"/><text class="tb" x="70" y="216">Claude Code extension</text><text class="ts" x="70" y="238">chat: “transcribe these voice notes”</text>
<rect class="stage" x="56" y="328" width="228" height="68" rx="4"/><text class="tb" x="70" y="352">Terminal</text><text class="tm" x="70" y="374">prepis.sh en file.opus</text>
<path class="lna" d="M170 260 V326" marker-end="url(#arrA)"/><text class="ts" x="180" y="298">runs</text>
<path class="lna" d="M90 192 V78" marker-end="url(#arrA)"/><text class="ts" x="98" y="112">prompt, outputs</text>
<path class="lna" d="M250 78 V190" marker-end="url(#arrA)"/><text class="ts" x="258" y="112">scripts, commands</text>
<rect class="draft" x="340" y="160" width="170" height="96" rx="4"/><text class="tb" x="352" y="184">1  Folder inbox/</text><text x="352" y="206">drop a recording here</text><text class="ts" x="352" y="226">a script watches it</text>
<rect class="stage" x="550" y="160" width="170" height="96" rx="4"/><text class="tb" x="562" y="184">2  Whisper locally</text><text x="562" y="206">speech to text</text><text class="ts" x="562" y="226">times from zero of the recording</text>
<rect class="draft" x="760" y="160" width="170" height="96" rx="4"/><text class="tb" x="772" y="184">3  Local AI</text><text x="772" y="206">model in Ollama</text><text class="ts" x="772" y="226">summary, chapters, actions</text>
<path class="lna" d="M284 362 H322 V208 H338" marker-end="url(#arrA)"/>
<path class="lna" d="M510 208 H548" marker-end="url(#arrA)"/><path class="lna" d="M720 190 H758" marker-end="url(#arrA)"/>
<text class="ts" x="531" y="198" text-anchor="middle">file</text><text class="ts" x="740" y="153" text-anchor="middle" style="font-size:11px">.srt with times</text>
<path class="lna" d="M845 256 V282" marker-end="url(#arrA)"/>
<rect class="draft" x="760" y="284" width="170" height="64" rx="4"/><text class="tb" x="772" y="308">4  Output</text><text class="ts" x="772" y="328" style="font-size:11px">summary.md, chapters</text>
<path class="lna" d="M845 348 V372" marker-end="url(#arrA)"/>
<rect class="box" x="760" y="374" width="170" height="56" rx="4"/><text class="tb" x="772" y="398">5  You: review</text><text class="ts" x="772" y="416" style="font-size:11px">fix names, add context</text>
<path class="lna" d="M845 430 V454" marker-end="url(#arrA)"/>
<rect class="stage" x="760" y="456" width="170" height="48" rx="4"/><text class="tb" x="772" y="485">KNIFE item</text>
<rect class="draft" x="340" y="330" width="380" height="64" rx="4"/><text class="tb" x="354" y="356">Glossary of names and terms</text><text class="tm" x="354" y="378">Kazicka, KNIFE, BaZi, …</text>
<path class="lnd" d="M635 330 V258" marker-end="url(#arrA)"/><text class="tm" x="627" y="300" text-anchor="end" style="font-size:11px">--initial-prompt</text>
<path class="lnd" d="M720 362 H742 V240 H758" marker-end="url(#arrA)"/><text class="ts" x="750" y="316" style="font-size:11px" text-anchor="start"></text>
<text class="ts" x="734" y="290" text-anchor="end" style="font-size:11px">rules for names</text>
<rect class="stage" x="40" y="540" width="30" height="16" rx="3"/><text class="ts" x="80" y="553">verified in this work</text>
<rect class="draft" x="300" y="540" width="30" height="16" rx="3"/><text class="ts" x="340" y="553">design, not yet verified</text>
</svg>