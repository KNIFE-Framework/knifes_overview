<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Five kinds of recording go through offline decoding, speech recognition and segments on a local computer. The output is plain text and text with timestamps relative to the start of the recording, which become a KNIFE item.">
<style>
text{font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif;font-size:13px;fill:#1c2624}
.tb{font-weight:600}.ts{font-size:12px;fill:#5d6b67}
.tm{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:11.5px}
.tc{font-size:11px;fill:#5d6b67;letter-spacing:.06em;text-transform:uppercase}
.box{fill:#fff;stroke:#8a9893;stroke-width:1.3}
.stage{fill:#d9ede9;stroke:#0b6e63;stroke-width:1.5}
.out{fill:#fff;stroke:#0b6e63;stroke-width:1.5}
.fence{fill:none;stroke:#0b6e63;stroke-width:1.4;stroke-dasharray:7 5}
.ln{fill:none;stroke:#1c2624;stroke-width:1.5}
.lna{fill:none;stroke:#0b6e63;stroke-width:1.8}
.acc{fill:#0b6e63}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2624"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="acc"/></marker></defs>
<rect width="1000" height="440" fill="#f8faf9"/>
<text class="tc" x="20" y="38">Possible inputs</text>
<rect class="box" x="20" y="60" width="210" height="52" rx="4"/><text class="tb" x="34" y="82">Voice message</text><text class="ts" x="34" y="100">WhatsApp, .opus</text>
<rect class="box" x="20" y="130" width="210" height="52" rx="4"/><text class="tb" x="34" y="152">Lecture</text><text class="ts" x="34" y="170">audio or video</text>
<rect class="box" x="20" y="200" width="210" height="52" rx="4"/><text class="tb" x="34" y="222">Workshop, seminar</text><text class="ts" x="34" y="240">recording from the room</text>
<rect class="box" x="20" y="270" width="210" height="52" rx="4"/><text class="tb" x="34" y="292">Meeting, call</text><text class="ts" x="34" y="310">recorded conversation</text>
<rect class="box" x="20" y="340" width="210" height="52" rx="4"/><text class="tb" x="34" y="362">Dictaphone, interview</text><text class="ts" x="34" y="380">.m4a, .mp3, .wav</text>
<path class="ln" d="M230 86 H262 M230 156 H262 M230 226 H262 M230 296 H262 M230 366 H262 M262 86 V366"/>
<path class="ln" d="M262 120 H312" marker-end="url(#arr)"/><text class="ts" x="268" y="112">file</text>
<rect class="fence" x="288" y="30" width="412" height="388" rx="8"/><text class="tc" x="304" y="52" style="fill:#0b6e63">Offline, on your own computer</text>
<rect class="stage" x="315" y="70" width="360" height="86" rx="4"/><text class="tb" x="331" y="94">1  Decoding</text><text x="331" y="114">ffmpeg converts .opus, .m4a, video</text><text x="331" y="132">to mono audio at 16 kHz</text>
<rect class="stage" x="315" y="196" width="360" height="86" rx="4"/><text class="tb" x="331" y="220">2  Speech recognition</text><text x="331" y="240">Whisper model runs locally, language set by you</text><text x="331" y="258">no internet once the model is downloaded</text>
<rect class="stage" x="315" y="322" width="360" height="72" rx="4"/><text class="tb" x="331" y="346">3  Segments</text><text x="331" y="366">every sentence has a start and an end</text><text x="331" y="384">in seconds from the start of the recording</text>
<path class="lna" d="M495 156 V194" marker-end="url(#arrA)"/><text class="ts" x="505" y="179">clean audio</text>
<path class="lna" d="M495 282 V320" marker-end="url(#arrA)"/><text class="ts" x="505" y="305">speech as text</text>
<text class="ts" x="304" y="412" style="font-size:11px">Neither the recording nor the text leaves the disk.</text>
<path class="lna" d="M675 358 H730 V130 H762" marker-end="url(#arrA)"/><path class="lna" d="M730 258 H762" marker-end="url(#arrA)"/><circle class="acc" cx="730" cy="258" r="3.5"/><circle class="acc" cx="730" cy="358" r="3.5"/>
<text class="tc" x="770" y="38">Output</text>
<rect class="out" x="764" y="60" width="216" height="100" rx="4"/><text class="tb" x="778" y="84">Plain text</text><text class="ts" x="778" y="102">.txt, for reading and pasting</text><text class="tm" x="778" y="126">Good morning, let us start</text><text class="tm" x="778" y="142">with today's topic…</text>
<rect class="out" x="764" y="188" width="216" height="140" rx="4"/><text class="tb" x="778" y="212">Timed text</text><text class="ts" x="778" y="230">.srt, .json: position in original</text>
<text class="tm" x="778" y="256">[00:00:00 → 00:00:04]</text><text class="tm" x="778" y="272">Good morning, let us start</text><text class="tm" x="778" y="294">[00:00:04 → 00:00:09]</text><text class="tm" x="778" y="310">with today's topic…</text>
<path class="lna" d="M872 328 V366" marker-end="url(#arrA)"/><text class="ts" x="882" y="352">time anchor</text>
<rect class="out" x="764" y="368" width="216" height="52" rx="4" style="fill:#d9ede9"/><text class="tb" x="778" y="391">KNIFE item</text><text class="ts" x="778" y="408">text plus a link to the minute</text>
</svg>