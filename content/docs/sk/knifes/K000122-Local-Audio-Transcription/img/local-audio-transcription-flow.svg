<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440" role="img" aria-label="Päť druhov nahrávok ide cez offline dekódovanie, rozpoznanie reči a segmenty na lokálnom počítači. Výstupom je text a text s časovými značkami od začiatku nahrávky, z ktorých vzniká položka v KNIFE.">
<style>
text{font-family:"IBM Plex Sans",Arial,Helvetica,sans-serif;font-size:13px;fill:#1c2624}
.tb{font-weight:600}.ts{font-size:12px;fill:#5d6b67}
.tm{font-family:"IBM Plex Mono",Menlo,Consolas,monospace;font-size:11.5px}
.tc{font-size:11px;fill:#5d6b67;letter-spacing:.06em;text-transform:uppercase}
.box{fill:#fff;stroke:#8a9893;stroke-width:1.3}
.stage{fill:#d9ede9;stroke:#0b6e63;stroke-width:1.5}
.out{fill:#fff;stroke:#0b6e63;stroke-width:1.5}
.fence{fill:none;stroke:#0b6e63;stroke-width:1.4;stroke-dasharray:7 5}
.ln{fill:none;stroke:#1c2624;stroke-width:1.5}
.lna{fill:none;stroke:#0b6e63;stroke-width:1.8}
.acc{fill:#0b6e63}
</style>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#1c2624"/></marker><marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="acc"/></marker></defs>
<rect width="1000" height="440" fill="#f8faf9"/>
<text class="tc" x="20" y="38">Možné vstupy</text>
<rect class="box" x="20" y="60" width="210" height="52" rx="4"/><text class="tb" x="34" y="82">Hlasovka</text><text class="ts" x="34" y="100">WhatsApp, .opus</text>
<rect class="box" x="20" y="130" width="210" height="52" rx="4"/><text class="tb" x="34" y="152">Prednáška</text><text class="ts" x="34" y="170">audio alebo video</text>
<rect class="box" x="20" y="200" width="210" height="52" rx="4"/><text class="tb" x="34" y="222">Cvičenie, seminár</text><text class="ts" x="34" y="240">nahrávka zo sály</text>
<rect class="box" x="20" y="270" width="210" height="52" rx="4"/><text class="tb" x="34" y="292">Porada, hovor</text><text class="ts" x="34" y="310">záznam rozhovoru</text>
<rect class="box" x="20" y="340" width="210" height="52" rx="4"/><text class="tb" x="34" y="362">Diktafón, rozhovor</text><text class="ts" x="34" y="380">.m4a, .mp3, .wav</text>
<path class="ln" d="M230 86 H262 M230 156 H262 M230 226 H262 M230 296 H262 M230 366 H262 M262 86 V366"/>
<path class="ln" d="M262 120 H312" marker-end="url(#arr)"/><text class="ts" x="268" y="112">súbor</text>
<rect class="fence" x="288" y="30" width="412" height="388" rx="8"/><text class="tc" x="304" y="52" style="fill:#0b6e63">Offline, na tvojom počítači</text>
<rect class="stage" x="315" y="70" width="360" height="86" rx="4"/><text class="tb" x="331" y="94">1  Dekódovanie</text><text x="331" y="114">ffmpeg prevedie .opus, .m4a, video</text><text x="331" y="132">na mono zvuk 16 kHz</text>
<rect class="stage" x="315" y="196" width="360" height="86" rx="4"/><text class="tb" x="331" y="220">2  Rozpoznanie reči</text><text x="331" y="240">model Whisper beží lokálne, jazyk sk alebo cs</text><text x="331" y="258">po stiahnutí modelu bez internetu</text>
<rect class="stage" x="315" y="322" width="360" height="72" rx="4"/><text class="tb" x="331" y="346">3  Segmenty</text><text x="331" y="366">každá veta má začiatok a koniec</text><text x="331" y="384">v sekundách od nuly nahrávky</text>
<path class="lna" d="M495 156 V194" marker-end="url(#arrA)"/><text class="ts" x="505" y="179">čistý zvuk</text>
<path class="lna" d="M495 282 V320" marker-end="url(#arrA)"/><text class="ts" x="505" y="305">reč ako text</text>
<text class="ts" x="304" y="412" style="font-size:11px">Nahrávka ani text neopustia disk.</text>
<path class="lna" d="M675 358 H730 V130 H762" marker-end="url(#arrA)"/><path class="lna" d="M730 258 H762" marker-end="url(#arrA)"/><circle class="acc" cx="730" cy="258" r="3.5"/><circle class="acc" cx="730" cy="358" r="3.5"/>
<text class="tc" x="770" y="38">Výstup</text>
<rect class="out" x="764" y="60" width="216" height="100" rx="4"/><text class="tb" x="778" y="84">Čistý text</text><text class="ts" x="778" y="102">.txt, na čítanie a vkladanie</text><text class="tm" x="778" y="126">Dobrý deň, začneme</text><text class="tm" x="778" y="142">dnešnou témou…</text>
<rect class="out" x="764" y="188" width="216" height="140" rx="4"/><text class="tb" x="778" y="212">Text s časom</text><text class="ts" x="778" y="230">.srt, .json: miesto v origináli</text>
<text class="tm" x="778" y="256">[00:00:00 → 00:00:04]</text><text class="tm" x="778" y="272">Dobrý deň, začneme</text><text class="tm" x="778" y="294">[00:00:04 → 00:00:09]</text><text class="tm" x="778" y="310">dnešnou témou…</text>
<path class="lna" d="M872 328 V366" marker-end="url(#arrA)"/><text class="ts" x="882" y="352">kotva na čas</text>
<rect class="out" x="764" y="368" width="216" height="52" rx="4" style="fill:#d9ede9"/><text class="tb" x="778" y="391">Položka v KNIFE</text><text class="ts" x="778" y="408">text a odkaz na minútu v zázname</text>
</svg>